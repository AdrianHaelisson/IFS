<script>
    //04. Escreva um programa que receba uma série de valores não nulos (diferentes de zero). Quando o usuário informar o valor zero (0), o programa deve informar a média dos valores informados anteriormente e encerrar.//

    let numero;
    let soma = 0;
    let i = 0;

    while (numero !== 0) {
        numero = Number(prompt('Insira um número (Digite 0 para saber a média)'))
        if (numero == 0){
            break
        }
        i++;
        soma += numero;
    }

    let media = soma/i
    alert (`A média dos valores é igual a ${media}`)

</script>
