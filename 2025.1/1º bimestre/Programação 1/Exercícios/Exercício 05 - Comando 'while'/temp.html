<script>
    // Programa que recebe números e calcula a média quando o usuário digita 0.
    
    let soma = 0;
    let i = 0;
    let numero;

    while (true) { // Loop infinito até o usuário digitar 0
        numero = Number(prompt('Insira um número (Digite 0 para saber a média)'));

        if (numero === 0) { // Se for 0, encerra o loop
            break;
        }

        soma += numero;
        i++;
    }

    if (i > 0) { // Garante que não haverá divisão por zero
        let media = soma / i;
        alert(`A média dos números informados é: ${media}`);
    } else {
        alert("Nenhum número válido foi inserido.");
    }
</script>
