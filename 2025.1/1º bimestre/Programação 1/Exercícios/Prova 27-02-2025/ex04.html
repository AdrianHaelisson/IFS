<script>
    let notas = 0;
    let soma = 0;
    let qtdNotas = 0;
    let media = 0

    while (notas => 0) {

        let notas = Number(prompt('Digite uma nota'))
        if (notas < 0) {
            break
        }
        qtdNotas++
        soma += notas
    }
    media = soma / qtdNotas

    if (media >= 6) {
        alert(`A média do aluno foi ${media} e ele está aprovado!`)
    } else {
        alert(`A média do aluno foi ${media} reprovado!`)
    }
</script>
