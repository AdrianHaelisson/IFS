<script>
    let n1 = Number(prompt('Insira o 1º valor'));
    let n2 = Number(prompt('Insira o 2º valor'));

    if (n1 > n2) {
        alert(`O primeiro valor (${n1}) é maior que o segundo valor (${n2})`)
    } else if (n1 < n2) {
        alert(`O primeiro valor (${n1}) é menor que o segundo valor (${n2})`)
    } else {
        alert(`O primeiro valor (${n1}) e o segundo valor (${n2}) são iguais`)
    }
</script>
