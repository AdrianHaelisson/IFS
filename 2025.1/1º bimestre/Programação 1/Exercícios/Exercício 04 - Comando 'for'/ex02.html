<script>
// 02. Escreva um programa que receba um número inteiro positivo N. Em seguida, mostre (usando alerts) todos os números de 1 a N. // 

    let n = Number(prompt('Insira um número:'))
    for (i = 1; i <= n; i++){
            alert(i)
        }
    if(n<1){
        alert('Número inválido, não é um inteiro positivo')
    }
</script>
