<script>
    //03. Escreva um programa que receba um número inteiro N diferente de zero. Em seguida, se N for positivo, mostre (usando alerts) todos os números de 1 até N; caso N seja negativo, mostre todos os números de -1 até N.//
    let n = Number(prompt('Insira um número'))
    
    if (n != 0){
        if (n > 0){
            for(i = 1; i <= n; i ++){
                alert(i)    
            } 
        }else{
            for( i = -1; i >= n; i--){
                alert(i)
            }
        }
    }
    </script>
