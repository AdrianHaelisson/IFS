<script>
    //05. Escreva um programa que receba um número inteiro positivo N. Em seguida, mostre todos os divisores de N. //
    
    let n = Number(prompt('Insira um número'))

    if (n > 0) {
        for (i = 1; i <= n; i++) {
            if(n % i == 0){
                alert(i)
            }
        }
    }
</script>
