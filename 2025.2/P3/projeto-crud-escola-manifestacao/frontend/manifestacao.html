<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Projeto Escolas</title>
<style>
  :root{
    --ink:#2c2c2c;
    --muted:#7a7a7a;
    --line:#e9e9e9;
    --accent:#7e57c2;
    --accent-strong:#6a3ac7;
    --bg:#fff;
    --radius:12px;
    --shadow:0 8px 24px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{
      margin:0;min-height:100vh;color:var(--ink);
      font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
      background:linear-gradient(180deg,#fafafa,#f3f3f3);
    }

  .card{
    max-width:360px; background:var(--bg);
    border-radius:var(--radius); box-shadow:var(--shadow);
    border:1px solid var(--line); overflow:hidden;
  }
  /* filete superior roxo */
  .card::before{
    content:""; display:block; height:4px; background:var(--accent);
  }

  .card__header{
    position:relative;
    padding:14px 16px 6px 16px;
  }

  .grid{
    display:grid; row-gap:8px;
  }
  .row{
    display:grid; grid-template-columns:1fr;
    border-bottom:1px solid var(--line);
    padding:10px 0;
  }
  .row:last-child{ border-bottom:0; padding-bottom:4px }
  .label{
    color:var(--accent);
    font-size:12px; text-transform:uppercase; font-weight:800;
    letter-spacing:.3px;
  }
  .value{
    color:#8a8a8a; font-weight:700; text-transform:uppercase;
    font-size:12.5px;
  }

  .gallery{
    display:grid; grid-template-columns:1fr 1fr; gap:10px;
    padding:10px 16px 6px 16px;
  }
  .thumb{
    height:76px; border-radius:10px; background:#f0f0f0;
    border:1px solid var(--line);
    display:grid; place-items:center;
    box-shadow: inset 0 2px 0 rgba(0,0,0,.02);
  }
  .thumb::before{
    content:"";
    width:48px; height:36px; border:2px dashed #cfcfcf; border-radius:6px;
  }

  .card__footer{
    border-top:1px solid var(--line);
    padding:10px 16px 14px;
  }
  .footer-head{
    display:flex; justify-content:space-between; align-items:center;
    font-weight:800; text-transform:uppercase; letter-spacing:.3px;
    color:var(--accent); font-size:12.5px;
    margin-bottom:6px;
  }
  .footer-head time{ color:#9c9c9c; font-weight:700; font-size:12px }
  .message{
    color:#5f5f5f; margin:0 0 10px 0; font-size:14px;
  }
  .cta{
    color:var(--accent); text-decoration:none; font-weight:800;
    text-transform:uppercase; font-size:12.5px; letter-spacing:.2px;
  }
  .cta:hover{ text-decoration:underline }

    .layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
    .sidebar{background:linear-gradient(180deg,var(--accent-strong), #8e6be9);color:#fff;padding:24px 18px;display:flex;flex-direction:column;gap:24px}
    .avatar{display:flex;flex-direction:column;align-items:center;gap:10px}
    .avatar img{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.65);box-shadow:0 6px 18px rgba(0,0,0,.25)}
    .avatar strong{font-weight:700;letter-spacing:.3px}
    .nav{display:flex;flex-direction:column;gap:8px}
    .nav__item{color:#f0eaff;text-decoration:none;font-weight:600;padding:10px 12px;border-radius:10px;display:block}
    .nav__item:hover,.nav__item.active{background:rgba(255,255,255,.12)}
    .content{padding:28px}
    .page-head h1{margin:0 0 16px 0;font-size:28px}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
        row-gap:20px;column-gap:23px;}
    .logo img{width:230px;height:auto;display:block;margin-top: -10px;}
    .delete-btn {
        font-weight:600;
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 1rem;
        font-size: 1rem;
        width: 100%;               /* O botão ocupa toda a largura do card */
        cursor: pointer;
        transition: background-color 0.3s ease;
        border-top: 1px solid #ddd; /* separação visual do conteúdo */
    }

    .delete-btn:hover {
        background-color: #c0392b;
    }
</style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <div class="logo">
            <img src="duca2.png"  />
        </div>
        <div class="avatar">
            <img src="student.jpg" alt="Usuário" />
            <strong>Danilo</strong>
        </div>
        <nav class="nav">
            <a href="index.html" class="nav__item ">Escolas</a>
            <a href="manifestacao.html" class="nav__item active">Manifestações</a>
            <a href="#" class="nav__item">Sobre</a>
        </nav>
    </aside>
    <main class="content">
      <header class="page-head">
        <h1>Manifestações</h1>
      </header>
      <section class="cards">
            <article class="card" role="region" aria-label="Manifestação">
                <div class="card__header">
                <div class="grid">
                    <div class="row">
                    <span class="label">Escola</span>
                    <span class="value">Colégio Estadual Abdias Bezerra</span>
                    </div>
                    <div class="row">
                    <span class="label">Endereço</span>
                    <span class="value">Avenida Barão do Rio Branco</span>
                    </div>
                    <div class="row">
                    <span class="label">Tipo de manifestação</span>
                    <span class="value">Denúncia</span>
                    </div>
                </div>
                </div>

                <div class="gallery">
                <div class="thumb" aria-label="Imagem 1 (placeholder)"></div>
                <div class="thumb" aria-label="Imagem 2 (placeholder)"></div>
                </div>

                <div class="card__footer">
                    <div class="footer-head">
                        <span>Manifestação</span>
                        <time datetime="2019-05-17">17 mai 2019</time>
                    </div>
                    <p class="message">existe goteiras em minha sala.</p>
                </div>
                <button class="delete-btn" aria-label="Excluir manifestação">EXCLUIR</button>
            </article>
    </section>
  </main>
</div>
<script>
  // Configuração do endpoint (ajuste conforme sua API)
  const API_BASE = 'http://localhost:3000/api/manifestacao';

  // Seletores principais
  const cardsContainer = document.querySelector('.cards');

  // Utilitário simples para formatar data ISO em dd MMM yyyy (pt-BR)
  function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Gera o HTML de um card de manifestação
  function cardHTML(m) {
    // m: { id, escolaNome, endereco, tipo, data, mensagem }
    const dataVisivel = formatDate(m.data);
    const datetimeAttr = m.data ? new Date(m.data).toISOString().slice(0,10) : '';

    return `
      <article class="card" role="region" aria-label="Manifestação" data-id="${m.id_manifestacao}">
        <div class="card__header">
          <div class="grid">
            <div class="row">
              <span class="label">Escola</span>
              <span class="value">${m.escola_nome ?? '-'}</span>
            </div>
            <div class="row">
              <span class="label">Endereço</span>
              <span class="value">${m.bairro ?? '-'}</span>
            </div>
            <div class="row">
              <span class="label">Tipo de manifestação</span>
              <span class="value">Denúncia</span>
            </div>
          </div>
        </div>

        <div class="gallery">
          <div class="thumb" aria-label="Imagem 1 (placeholder)"></div>
          <div class="thumb" aria-label="Imagem 2 (placeholder)"></div>
        </div>

        <div class="card__footer">
          <div class="footer-head">
            <span>Manifestação</span>
            <time datetime="${datetimeAttr}">${dataVisivel}</time>
          </div>
          <p class="message">${m.descricao ?? ''}</p>
        </div>

        <button class="delete-btn" aria-label="Excluir manifestação" data-action="delete">
          EXCLUIR
        </button>
      </article>
    `;
  }

  // Renderiza a lista na tela
  function renderLista(manifestacoes) {
    if (!Array.isArray(manifestacoes) || manifestacoes.length === 0) {
      cardsContainer.innerHTML = `<p style="color:#7a7a7a">Nenhuma manifestação encontrada.</p>`;
      return;
    }
    const html = manifestacoes.map(cardHTML).join('');
    cardsContainer.innerHTML = html;
  }

  // Busca dados no endpoint GET /api/manifestacoes
  async function carregarManifestacoes() {
    // Indicador simples de carregamento
    cardsContainer.innerHTML = `<p style="color:#7a7a7a">Carregando...</p>`;
    try {
      const resp = await fetch(API_BASE, { method: 'GET' });
      if (!resp.ok) throw new Error('Falha ao carregar manifestações');
      const data = await resp.json();
      renderLista(data);
    } catch (err) {
      console.error(err);
      cardsContainer.innerHTML = `<p style="color:#b00020">Erro ao carregar manifestações.</p>`;
    }
  }

  // Deleta uma manifestação pelo id com DELETE /api/manifestacoes/:id
  async function deletarManifestacao(id, $article) {
    // Otimismo: remove visualmente primeiro; se falhar, reverte
    const backupHTML = $article.outerHTML;
    $article.style.opacity = '0.5';
    $article.style.pointerEvents = 'none';

    try {
      const resp = await fetch(`${API_BASE}/${id}`, { method: 'DELETE' });
      if (!resp.ok) throw new Error('Falha ao excluir');
      // Remover do DOM
      $article.remove();

      // Se ficou vazio, mostra mensagem
      if (!cardsContainer.querySelector('.card')) {
        cardsContainer.innerHTML = `<p style="color:#7a7a7a">Nenhuma manifestação restante.</p>`;
      }
    } catch (err) {
      console.error(err);
      // Reverte visual
      const temp = document.createElement('div');
      temp.innerHTML = backupHTML;
      const restored = temp.firstElementChild;
      $article.replaceWith(restored);
      alert('Não foi possível excluir a manifestação.');
    }
  }

  // Delegação de eventos para capturar cliques em qualquer botão ".delete-btn"
  cardsContainer.addEventListener('click', (e) => {
    
    const btn = /** @type {HTMLElement} */ (e.target);
    if (!btn || btn.getAttribute('data-action') !== 'delete') return;

    const article = btn.closest('.card');
    if (!article) return;

    const id = Number(article.getAttribute('data-id'));
    if (!id) return;

    // Confirmação simples
    const ok = confirm('Deseja realmente excluir esta manifestação?');
    if (!ok) return;

    deletarManifestacao(id, article);
  });

  // Inicialização
  carregarManifestacoes();
</script>

</body>
</html>
