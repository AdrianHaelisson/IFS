<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Quero Delivery</title>
    <meta name='viewport' content='width=device-width, initial-scale=1', shrink-to-fit="no">
    <link rel='stylesheet' type='text/css' media='screen' href='./css/style.css'>
    <script src='./js/main.js'></script>
</head>
<body>
    <header>
       📍 Meu Endereço Aqui
    </header>

    <main>
        <form class="form-busca">
            <input type="text" class="input-busca" placeholder="O que você quer hoje?">
            <button>🔍</button>
        </form>

        <h2>Estabelecimentos</h2>
        
        <div class="div-estabelecimentos">
            <div class="div-estabelecimento">
                <div style="background-image:url(img/empresas/Canon.png);"></div>
                <b>Canon</b>
                <span>⭐ 5,0</span>
            </div>
            
            <div class="div-estabelecimento">
                <div style="background-image:url(img/empresas/Coca-Cola.png);"></div>
                <b>Coca-cola</b>
                <span>⭐ 5,0</span>
            </div>

            <div class="div-estabelecimento">
                <div style="background-image:url(img/empresas/Disney.png);"></div>
                <b>Disney</b>
                <span>⭐ 5,0</span>
            </div> 
        </div>

        <h2>Produtos</h2>
        <div class="div-produtos">
            <div class="div-produto">
                <div style="background-image: url(img/produtos/acai.webp);"></div>
                <b>Açaí</b>
                <span>R$ 9,90</span>
            </div>

            <div class="div-produto">
                <div style="background-image: url(img/produtos/hamburguer.jpg);"></div>
                <b>Hamburguer</b>
                <span>R$ 9,90</span>
            </div>

            <div class="div-produto">
                <div style="background-image: url(img/produtos/pizza.png);"></div>
                <b>Pizza</b>
                <span>R$ 9,90</span>
            </div>

            <div class="div-produto">
                <div style="background-image: url(img/produtos/tapioca.jfif);"></div>
                <b>Tapioca</b>
                <span>R$ 9,90</span>
            </div>
        </div>

    </main>
    <nav>
        <a href="#">Início</a>
        <a href="#">Busca</a>
        <a href="#">Favoritos</a>
        <a href="#">Pedidos</a>
        <a href="#">Menu</a>
    </nav>

    
</body>
</html>
