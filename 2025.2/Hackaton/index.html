<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feira IFS - Catálogo</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--surface-color);
            padding: 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-img-container {
            width: 100%;
            height: 150px;
            background-color: var(--background-color);
            border-radius: 4px;
            margin-bottom: 0.75rem;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-placeholder {
            font-size: 2rem;
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <header>
            <h1>Feira de Empreendedorismo</h1>
            <div style="display:flex; align-items:center; gap:1rem;">
                <button onclick="openCart()" class="secondary"
                    style="position:relative; border:none; background:transparent; padding:0.5rem;">
                    <span style="font-size:1.5rem;">🛒</span>
                    <span id="cartCount"
                        style="position:absolute; top:0; right:0; background-color:var(--primary-color); color:var(--surface-color); font-size:0.75rem; font-weight:bold; padding:0.1rem 0.4rem; border-radius:1rem; display:none;">0</span>
                </button>
                <div id="user-info"></div>
            </div>
        </header>

        <main>
            <!-- Tabs Navigation -->
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <button onclick="showTab('catalog')" id="btn-catalog">Catálogo</button>
                <button onclick="showTab('orders')" id="btn-orders" class="secondary">Meus Pedidos</button>
            </div>

            <!-- CATALOG TAB -->
            <div id="tab-catalog">
                <div class="card">
                    <h2>Catálogo de Produtos</h2>
                    <div class="search-container"
                        style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1rem; align-items:flex-end;">
                        <div style="flex:1;">
                            <label
                                style="font-size:0.85rem; color:#64748b; display:block; margin-bottom:0.25rem;">Buscar</label>
                            <input type="text" id="searchName" placeholder="Nome do produto..." style="width:100%;">
                        </div>
                        <div>
                            <label style="font-size:0.85rem; color:#64748b; display:block; margin-bottom:0.25rem;">Preço
                                Máx</label>
                            <input type="number" id="searchMaxPrice" placeholder="R$ 0,00" style="width:100px;">
                        </div>
                        <div>
                            <label
                                style="font-size:0.85rem; color:#64748b; display:block; margin-bottom:0.25rem;">Tipo</label>
                            <select id="filterType" style="width:auto;">
                                <option value="">Todos</option>
                                <option value="Produto">Produtos</option>
                                <option value="Serviço">Serviços</option>
                            </select>
                        </div>
                        <div>
                            <label
                                style="font-size:0.85rem; color:#64748b; display:block; margin-bottom:0.25rem;">Expositor</label>
                            <select id="filterExhibitor" style="width:auto;">
                                <option value="">Todos</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="catalog" class="product-grid" style="margin-top: 1.5rem;">
                    <!-- Products -->
                </div>
            </div>

            <!-- ORDERS TAB -->
            <div id="tab-orders" class="hidden">
                <div class="card">
                    <h2>Histórico de Compras</h2>
                    <div id="myOrdersList">
                        <p style="text-align:center; color: #64748b;">Nenhuma compra realizada ainda.</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Carrinho (Simples) -->
    <div id="buyModal" class="card"
        style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); width:300px; box-shadow:0 00 20px rgba(0,0,0,0.2); display:none; z-index:100;">
        <h3>Comprar Produto</h3>
        <p id="modalProdName"></p>
        <div class="form-group">
            <label id="modalQtyLabel">Quantidade</label>
            <input type="number" id="modalQty" value="1" min="1">
        </div>
        <div class="form-group">
            <label>Forma de Pagamento</label>
            <select id="modalPayment">
                <option value="Dinheiro">Dinheiro</option>
                <option value="PIX">PIX</option>
                <option value="Cartão">Cartão</option>
            </select>
        </div>
        </select>
    </div>
    <div id="cash-change-group"
        style="display:none; background-color:var(--background-color); padding:0.75rem; border-radius:4px; margin-bottom:1rem; border:1px solid var(--border-color);">
        <div style="margin-bottom:0.5rem; display:flex; align-items:center; gap:1rem;">
            <span style="font-weight:600; font-size:0.9rem;">Precisa de troco?</span>
            <label style="display:flex; align-items:center; cursor:pointer; font-size:0.9rem;">
                <input type="radio" name="needChange" value="yes" style="width:auto; margin-right:0.25rem;"> Sim
            </label>
            <label style="display:flex; align-items:center; cursor:pointer; font-size:0.9rem;">
                <input type="radio" name="needChange" value="no" checked style="width:auto; margin-right:0.25rem;">
                Não
            </label>
        </div>
        <div id="change-input-wrapper" style="display:none;">
            <label style="font-size:0.9rem;">Troco para quanto?</label>
            <input type="number" id="modalCashAmount" step="0.01" placeholder="R$ 50,00" style="margin-top:0.25rem;">
            <div style="text-align:right; font-weight:bold; color:var(--success-color); margin-top:0.5rem;"
                id="modalChangeDisplay">
                Troco: R$ 0.00
            </div>
        </div>
        <p id="exact-change-msg" style="font-size:0.85rem; color:#64748b; margin:0;">
            Sem troco (dinheiro trocado).
        </p>
    </div>

    </div>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        // Check Auth (Consumer or generic view)
        const user = Auth.check(['CONSUMER', 'ADMIN']);
        // Admin also can see catalog for testing

        const catalogDiv = document.getElementById('catalog');
        const ordersListDiv = document.getElementById('myOrdersList');

        // Tabs Logic
        window.showTab = (tab) => {
            if (tab === 'catalog') {
                document.getElementById('tab-catalog').classList.remove('hidden');
                document.getElementById('tab-orders').classList.add('hidden');
                document.getElementById('btn-catalog').classList.remove('secondary');
                document.getElementById('btn-orders').classList.add('secondary');
            } else {
                document.getElementById('tab-catalog').classList.add('hidden');
                document.getElementById('tab-orders').classList.remove('hidden');
                document.getElementById('btn-catalog').classList.add('secondary');
                document.getElementById('btn-orders').classList.remove('secondary');
                renderMyOrders();
            }
        }

        // --- Catalog Logic ---
        const exhibitors = Store.getExhibitors();
        const filterExhibitor = document.getElementById('filterExhibitor');

        exhibitors.forEach(e => {
            const opt = document.createElement('option');
            opt.value = e.id;
            opt.textContent = e.name;
            filterExhibitor.appendChild(opt);
        });

        // Filter Event Listeners
        document.getElementById('searchName').addEventListener('input', () => renderCatalog());
        document.getElementById('searchMaxPrice').addEventListener('input', () => renderCatalog());
        document.getElementById('filterType').addEventListener('change', () => renderCatalog());
        filterExhibitor.addEventListener('change', () => renderCatalog());

        function renderCatalog() {
            // Get Filter Values
            const searchName = document.getElementById('searchName').value.toLowerCase();
            const searchMaxPrice = parseFloat(document.getElementById('searchMaxPrice').value);
            const selectedType = document.getElementById('filterType').value;
            const selectedExhibitor = filterExhibitor.value;

            // Get All Products (we filter in memory)
            // Note: Store.getProducts(null) returns ALL products
            let products = Store.getProducts();

            // Apply Filters
            products = products.filter(p => {
                // Exhibitor Filter
                if (selectedExhibitor && p.exhibitorId != selectedExhibitor) return false;

                // Name Filter
                if (searchName && !p.name.toLowerCase().includes(searchName)) return false;

                // Price Filter
                if (!isNaN(searchMaxPrice) && p.price > searchMaxPrice) return false;

                // Type Filter
                if (selectedType && p.type !== selectedType) return false;

                return true;
            });

            const catalogDiv = document.getElementById('catalog');
            catalogDiv.innerHTML = '';

            if (products.length === 0) {
                catalogDiv.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:2rem; color:#64748b;">Nenhum produto encontrado com esses filtros.</p>';
                return;
            }

            products.forEach(p => {
                if (p.stock > 0 || p.type === 'Serviço') { // Show services even if stock logic is weird, or ensure stock logic handles services
                    // (Assuming stock > 0 check is valid for products, services usually have stock 999999)
                    const ex = exhibitors.find(e => e.id == p.exhibitorId);
                    const div = document.createElement('div');

                    // Logic for image
                    const imgContent = p.image
                        ? `<img src="${p.image}" alt="${p.name}">`
                        : `<div class="product-placeholder">📷</div>`;

                    // Logic for Type Label (Always show now)
                    const typeLabel = p.type === 'Serviço' ? 'Serviço' : 'Produto';
                    const typeColor = p.type === 'Serviço' ? '#0ea5e9' : '#10b981';

                    div.className = 'product-card';
                    div.innerHTML = `
                        <div>
                            <div class="product-img-container">
                                ${imgContent}
                            </div>
                            <div style="display:flex; justify-content:space-between; align-items:start;">
                                <h3 style="font-size:1.1rem; color:var(--primary-color); margin:0;">${p.name}</h3>
                            </div>
                            <p style="font-size:0.8rem; color:#64748b; margin-top:0.25rem;">${ex ? ex.name : 'Unknown'}</p>
                            
                            <!-- Visualização do Tipo -->
                            <div style="font-size:0.75rem; font-weight:600; color:${typeColor}; text-transform:uppercase; margin-bottom:0.5rem; letter-spacing:0.5px;">
                                ${typeLabel}
                            </div>
                            
                            <p style="font-size:0.9rem; color:#334155;">${p.description || ''}</p>
                        </div>
                        <div style="margin-top:1rem;">
                            <strong style="display:block; font-size:1.2rem; margin-bottom:0.5rem;">R$ ${p.price.toFixed(2)}</strong>
                            <button onclick="openAddModal(${p.id})" style="width:100%;">Adicionar</button>
                        </div>
                    `;
                    catalogDiv.appendChild(div);
                }
            });
        }

        // Cart & Modal Logic
        let currentModalProduct = null;

        // --- NEW MODAL: Add to Cart ---
        window.openAddModal = (prodId) => {
            const products = Store.getProducts();
            currentModalProduct = products.find(p => p.id == prodId);

            if (currentModalProduct) {
                // Render Modal content for ADDING
                const container = document.getElementById('buyModal');
                container.innerHTML = `
                        <h3>Adicionar ao Carrinho</h3>
                        <div style="margin-bottom:1rem;">
                            <strong>${currentModalProduct.name}</strong><br>
                            <span style="color:var(--text-secondary); font-size:0.9rem;">R$ ${currentModalProduct.price.toFixed(2)} / ${currentModalProduct.unit || 'un'}</span>
                        </div>
                        <div class="form-group">
                            <label>Quantidade</label>
                            <input type="number" id="modalQty" value="1" min="1" max="${currentModalProduct.stock}" style="width:100%;">
                        </div>
                        <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
                            <button onclick="closeModal()" class="secondary">Cancelar</button>
                            <button onclick="confirmAddToCart()">Adicionar</button>
                        </div>
                  `;
                document.getElementById('buyModal').style.display = 'block';
                // Focus input
                setTimeout(() => document.getElementById('modalQty').focus(), 100);
            }
        }

        window.confirmAddToCart = () => {
            if (!currentModalProduct) return;
            const qtyVal = parseInt(document.getElementById('modalQty').value);

            // Validation
            if (isNaN(qtyVal) || qtyVal < 1) {
                alert('Quantidade inválida');
                return;
            }

            // Check Stock (checking against store again for safety, or current object)
            const products = Store.getProducts();
            const p = products.find(i => i.id == currentModalProduct.id);

            // Check existing cart qty + new qty
            const cart = Store.getCart();
            const existing = cart.find(i => i.productId == p.id);
            const currentCartQty = existing ? existing.quantity : 0;

            if ((currentCartQty + qtyVal) > p.stock) {
                alert('Estoque insuficiente! Você já tem ' + currentCartQty + ' no carrinho.');
                return;
            }

            Store.addToCart({
                productId: p.id,
                name: p.name,
                price: p.price,
                quantity: qtyVal,
                exhibitorId: p.exhibitorId,
                image: p.image
            });

            updateCartCount();
            closeModal();
            // alert('Adicionado!'); // Maybe too intrusive? Let's skip alert for smoother flow.
        }

        function updateCartCount() {
            const cart = Store.getCart();
            const count = cart.reduce((acc, item) => acc + item.quantity, 0);
            const badge = document.getElementById('cartCount');
            if (count > 0) {
                badge.style.display = 'block';
                badge.textContent = count;
            } else {
                badge.style.display = 'none';
            }
        }

        window.openCart = () => {
            renderCartModal();
            document.getElementById('buyModal').style.display = 'block';
        }

        function renderCartModal() {
            const cart = Store.getCart();
            const modalTitle = document.querySelector('#buyModal h3');
            modalTitle.textContent = 'Meu Carrinho';

            // Hide single product elements, ideally we should have separate modals or switch content
            // Let's switch content dynamically for simplicity or cleanliness

            // BUT wait, the existing modal is "Comprar Produto" specific.
            // Let's REUSE it but change content slightly OR just build the HTML here.

            const container = document.getElementById('buyModal');

            // Overwrite innerHTML completely for Cart View
            let itemsHtml = '';
            let total = 0;

            if (cart.length === 0) {
                itemsHtml = '<p style="text-align:center; color:var(--text-secondary);">Carrinho vazio.</p>';
            } else {
                itemsHtml = '<ul style="list-style:none; padding:0; margin-bottom:1rem; max-height:300px; overflow-y:auto;">';
                cart.forEach(item => {
                    total += item.price * item.quantity;
                    // Get max stock for this item to limit input
                    const productInfo = Store.getProducts().find(p => p.id == item.productId);
                    const maxStock = productInfo ? productInfo.stock : 999;

                    itemsHtml += `
                        <li style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border-color); padding:0.75rem 0;">
                            <div style="flex:1;">
                                <strong>${item.name}</strong>
                                <div style="font-size:0.8rem; color:var(--text-secondary);">R$ ${item.price.toFixed(2)} un.</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:0.5rem;">
                                <input type="number" 
                                       value="${item.quantity}" 
                                       min="1" 
                                       max="${maxStock}"
                                       onchange="updateItemQty(${item.productId}, this.value)"
                                       style="width:50px; padding:0.25rem; text-align:center;">
                                <button onclick="removeFromCart(${item.productId})" style="padding:0.25rem 0.5rem; font-size:0.8rem; background:transparent; color:var(--danger-color); border:1px solid var(--danger-color);">Wait</button>
                            </div>
                        </li>
                    `;
                });
                // Replace "Wait" button text with icon or X. 
                // Ah, simpler string replace:
                itemsHtml = itemsHtml.replace(/Wait/g, 'X');

                itemsHtml += '</ul>';
                itemsHtml += `<div style="text-align:right; font-weight:bold; margin-bottom:1rem; font-size:1.1rem;">Total: R$ ${total.toFixed(2)}</div>`;
            }

            container.innerHTML = `
                <h3>Meu Carrinho</h3>
                ${itemsHtml}
                
                ${cart.length > 0 ? `
                <div class="form-group">
                    <label>Forma de Pagamento</label>
                    <select id="modalPayment">
                        <option value="Dinheiro">Dinheiro</option>
                        <option value="PIX">PIX</option>
                        <option value="Cartão">Cartão</option>
                    </select>
                </div>
                <div id="cash-change-group" style="display:block; background-color:var(--background-color); padding:0.75rem; border-radius:4px; margin-bottom:1rem; border:1px solid var(--border-color);">
                     <div style="margin-bottom:0.5rem; display:flex; align-items:center; gap:1rem;">
                        <span style="font-weight:600; font-size:0.9rem;">Precisa de troco?</span>
                        <label style="display:flex; align-items:center; cursor:pointer; font-size:0.9rem;">
                            <input type="radio" name="needChange" value="yes" style="width:auto; margin-right:0.25rem;"> Sim
                        </label>
                        <label style="display:flex; align-items:center; cursor:pointer; font-size:0.9rem;">
                            <input type="radio" name="needChange" value="no" checked style="width:auto; margin-right:0.25rem;"> Não
                        </label>
                    </div>
                    <div id="change-input-wrapper" style="display:none;">
                        <label style="font-size:0.9rem;">Troco para quanto?</label>
                        <input type="number" id="modalCashAmount" step="0.01" placeholder="R$ 50,00" style="margin-top:0.25rem;">
                        <div style="text-align:right; font-weight:bold; color:var(--success-color); margin-top:0.5rem;" id="modalChangeDisplay">
                            Troco: R$ 0.00
                        </div>
                    </div>
                </div>
                ` : ''}

                <div style="display:flex; justify-content:flex-end; gap:0.5rem;">
                    <button onclick="closeModal()" class="secondary">Fechar</button>
                    ${cart.length > 0 ? `<button onclick="confirmCheckout()">Finalizar Compra</button>` : ''}
                </div>
            `;

            // Re-attach Element Listeners because we wiped innerHTML
            if (cart.length > 0) {
                document.getElementById('modalPayment').addEventListener('change', (e) => {
                    const group = document.getElementById('cash-change-group');
                    if (e.target.value === 'Dinheiro') group.style.display = 'block';
                    else group.style.display = 'none';
                });

                document.querySelectorAll('input[name="needChange"]').forEach(radio => {
                    radio.addEventListener('change', (e) => {
                        const inputWrapper = document.getElementById('change-input-wrapper');
                        if (e.target.value === 'yes') {
                            inputWrapper.style.display = 'block';
                        } else {
                            inputWrapper.style.display = 'none';
                        }
                    });
                });

                document.getElementById('modalCashAmount').addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    if (!isNaN(val) && val >= total) {
                        const change = val - total;
                        document.getElementById('modalChangeDisplay').textContent = `Troco: R$ ${change.toFixed(2)}`;
                        document.getElementById('modalChangeDisplay').style.color = 'var(--success-color)';
                    } else {
                        document.getElementById('modalChangeDisplay').textContent = 'Valor insuficiente';
                        document.getElementById('modalChangeDisplay').style.color = 'var(--danger-color)';
                    }
                });
            }
        }

        window.updateItemQty = (prodId, newQty) => {
            const qty = parseInt(newQty);
            if (isNaN(qty) || qty < 1) return; // Ignore or reset?

            // Check stock
            const productInfo = Store.getProducts().find(p => p.id == prodId);
            if (productInfo && qty > productInfo.stock) {
                alert('Estoque insuficiente! Máximo disponível: ' + productInfo.stock);
                Store.updateCartItemQuantity(prodId, productInfo.stock);
                renderCartModal();
                return;
            }

            Store.updateCartItemQuantity(prodId, qty);
            renderCartModal();
            updateCartCount();
        }

        window.removeFromCart = (id) => {
            Store.removeFromCart(id);
            renderCartModal();
            updateCartCount();
        }

        window.confirmCheckout = () => {
            const cart = Store.getCart();
            if (cart.length === 0) return;

            const payMethod = document.getElementById('modalPayment').value;
            let amountPaidInput = 0;
            const totalCart = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);

            if (payMethod === 'Dinheiro') {
                const needsChange = document.querySelector('input[name="needChange"]:checked').value === 'yes';
                if (needsChange) {
                    amountPaidInput = parseFloat(document.getElementById('modalCashAmount').value);
                    if (isNaN(amountPaidInput) || amountPaidInput < totalCart) {
                        alert('Valor para troco deve ser maior que o Total do Carrinho (R$ ' + totalCart.toFixed(2) + ')!');
                        return;
                    }
                }
            }

            // Split Orders by Exhibitor
            const ordersByExhibitor = {};
            cart.forEach(item => {
                if (!ordersByExhibitor[item.exhibitorId]) {
                    ordersByExhibitor[item.exhibitorId] = {
                        items: [],
                        total: 0
                    };
                }
                ordersByExhibitor[item.exhibitorId].items.push(item);
                ordersByExhibitor[item.exhibitorId].total += (item.price * item.quantity);
            });

            // Create Orders
            Object.entries(ordersByExhibitor).forEach(([exId, data]) => {
                // Change Logic:
                // We apply the "Amount Paid" to EACH order if provided, implying "Bring change for X".
                // This ensures every exhibitor knows the bill size.

                let changeVal = 0;
                let orderAmountPaid = 0;

                if (payMethod === 'Dinheiro') {
                    if (amountPaidInput > 0) {
                        // User said "Change for X"
                        orderAmountPaid = amountPaidInput;
                        changeVal = amountPaidInput - data.total;
                    } else {
                        // Exact change assumed or not specified
                        orderAmountPaid = data.total;
                        changeVal = 0;
                    }
                }

                Store.addOrder({
                    exhibitorId: exId,
                    consumerId: user.id || 0,
                    clientName: user.name || 'Consumidor',
                    paymentMethod: payMethod,
                    paymentStatus: 'Pendente',
                    change: changeVal,
                    amountPaid: orderAmountPaid,
                    items: data.items.map(i => ({
                        productId: i.productId,
                        name: i.name,
                        quantity: i.quantity,
                        unitPrice: i.price
                    }))
                });
            });

            alert('Pedidos realizados com sucesso!');
            Store.clearCart();
            closeModal();
            updateCartCount();
            // Maybe renderOrders?
            showTab('orders'); // Auto switch to orders tab to see status
        }

        window.openModal = (prodId) => {
            // Deprecated/Refactored to addToCart
            addToCartClick(prodId);
        }

        // Legacy Change Calc Logic removed/integrated into renderCartModal
        window.closeModal = () => {
            document.getElementById('buyModal').style.display = 'none';
            currentModalProduct = null;
        }

        /* 
           Legacy confirmBuy removed. 
        */

        // --- Orders Logic ---
        function renderMyOrders() {
            if (!user) return; // Should allow guest but we force login now
            const orders = Store.getOrders(null, user.id); // Filter by consumerId
            ordersListDiv.innerHTML = '';

            if (orders.length === 0) {
                ordersListDiv.innerHTML = '<p style="text-align:center; color: #64748b;">Nenhuma compra realizada ainda.</p>';
                return;
            }

            orders.reverse().forEach(order => {
                const ex = exhibitors.find(e => e.id == order.exhibitorId);
                const exName = ex ? ex.name : 'Expositor Desconhecido';

                const statusColor = order.status === 'Novo' ? 'info' : (order.status === 'Em Preparação' ? 'warning' : (order.status === 'Entregue' ? 'success' : 'secondary'));

                const div = document.createElement('div');
                div.style.borderBottom = '1px solid #e2e8f0';
                div.style.padding = '1rem 0';

                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:0.5rem;">
                        <strong>Pedido #${order.id.toString().slice(-4)}</strong>
                        <span class="badge ${statusColor}">${order.status}</span>
                    </div>
                    <div style="font-size:0.9rem; color:#64748b; margin-bottom:0.5rem;">
                        De: <strong>${exName}</strong> &bull; ${new Date(order.createdAt).toLocaleString()}
                    </div>
                    <ul style="font-size: 0.9rem; margin-bottom:0.5rem; padding-left:1rem;">
                        ${order.items.map(i => `<li>${i.quantity}x ${i.name}</li>`).join('')}
                    </ul>
                    <div style="text-align:right; font-weight:600;">
                        Total: R$ ${order.totalValue.toFixed(2)}
                    </div>
                `;
                ordersListDiv.appendChild(div);
            });
        }

        // Init
        renderCatalog();
        updateCartCount();
    </script>
    <script src="assets/js/theme.js"></script>
</body>

</html>
